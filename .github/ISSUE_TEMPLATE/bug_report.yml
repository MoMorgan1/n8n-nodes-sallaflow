name: Bug report
description: Report a reproducible problem in the SallaFlow community node
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SallaFlow. Remove credentials, merchant data,
        private URLs, and raw production payloads before submitting.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The installed n8n-nodes-sallaflow version.
      placeholder: 0.6.3
    validations:
      required: true

  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      placeholder: 2.x.x
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.22.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: n8n installation
      options:
        - Self-hosted Docker
        - Self-hosted npm
        - Provider-managed n8n
        - n8n Cloud
        - Other
    validations:
      required: true

  - type: input
    id: node-resource
    attributes:
      label: Node, resource, and operation or event
      placeholder: SallaFlow Action / Order / Get Many
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the sanitized error text, not credentials or raw customer data.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic values and a minimal workflow where possible.
      placeholder: |
        1. Add...
        2. Configure...
        3. Execute...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional sanitized context
      description: Attach a sanitized workflow only if it contains no secrets or merchant data.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, merchant/customer data, and private operational URLs.
          required: true
        - label: I searched existing issues before opening this report.
          required: true
