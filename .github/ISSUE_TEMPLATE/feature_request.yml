name: Feature request
description: Suggest a maintainable node capability or UX improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the merchant workflow and desired outcome. Do not include
        credentials, private backend details, or real merchant data.

  - type: textarea
    id: problem
    attributes:
      label: Problem or merchant workflow
      description: What are you trying to automate, and what blocks you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the resource, operation, event, fields, and expected output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: input
    id: salla-reference
    attributes:
      label: Public Salla API reference
      description: Link to public Salla documentation when relevant.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any saved-workflow, Action v5, or Trigger v2 impact you anticipate.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request contains no credentials, private infrastructure details, or merchant data.
          required: true
